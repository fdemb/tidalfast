# Builds the macOS .dmg, the Linux AppImage and the Windows .zip with
# build.py dist. A tag v1.2.3 publishes all three as the GitHub release
# v1.2.3, or adds them to it when the release was made in GitHub's UI, which
# pushes the tag. A manual run only uploads them as workflow artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TIDALFAST_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-odin
      - run: python3 build.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/dist/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    env:
      # linuxdeploy is an AppImage itself, and the runner has no FUSE to mount it.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang pkg-config libwayland-dev wayland-protocols libxkbcommon-dev \
            libvulkan-dev glslang-tools libfreetype-dev libfontconfig-dev zlib1g-dev cmake libsystemd-dev
      - uses: ./.github/actions/install-odin
      - name: Install linuxdeploy
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x ./*.AppImage
          ln -s linuxdeploy-x86_64.AppImage linuxdeploy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: python3 build.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/dist/*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-odin
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: python build.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/dist/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $pre
          fi
