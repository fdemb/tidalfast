<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a36"/>
      <stop offset="1" stop-color="#070b10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="play" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8dfff4"/>
      <stop offset="0.45" stop-color="#00e0ff"/>
      <stop offset="1" stop-color="#2a6cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00e0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <!-- Two waves cut through the triangle, so it reads as a play button made of three swells. -->
    <mask id="waves" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="32" stroke-linecap="round">
        <path d="M300 452 C 370 412, 440 412, 510 452 S 650 492, 720 452 S 860 412, 930 452"/>
        <path d="M300 584 C 370 544, 440 544, 510 584 S 650 624, 720 584 S 860 544, 930 584"/>
      </g>
    </mask>
  </defs>

  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000" fill-opacity="0.35" filter="url(#blur)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <circle cx="530" cy="512" r="330" fill="url(#glow)"/>

  <g mask="url(#waves)">
    <path d="M404 322 L 740 512 L 404 702 Z" fill="url(#play)" stroke="url(#play)" stroke-width="64" stroke-linejoin="round"/>
  </g>
</svg>
