<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- The tile is a superellipse (n = 5), close to Apple's continuous corners. -->
    <path id="tile" d="M153.3,153.3C193.2,113.5 233,110.3 272.9,105.6C312.7,100.8 352.6,100.5 392.4,100.2C432.3,99.9 472.1,100 512,100C551.9,100 591.7,99.9 631.6,100.2C671.4,100.5 711.3,100.8 751.1,105.6C791,110.3 830.8,113.5 870.7,153.3C910.5,193.2 913.7,233 918.4,272.9C923.2,312.7 923.5,352.6 923.8,392.4C924.1,432.3 924,472.1 924,512C924,551.9 924.1,591.7 923.8,631.6C923.5,671.4 923.2,711.3 918.4,751.1C913.7,791 910.5,830.8 870.7,870.7C830.8,910.5 791,913.7 751.1,918.4C711.3,923.2 671.4,923.5 631.6,923.8C591.7,924.1 551.9,924 512,924C472.1,924 432.3,924.1 392.4,923.8C352.6,923.5 312.7,923.2 272.9,918.4C233,913.7 193.2,910.5 153.3,870.7C113.5,830.8 110.3,791 105.6,751.1C100.8,711.3 100.5,671.4 100.2,631.6C99.9,591.7 100,551.9 100,512C100,472.1 99.9,432.3 100.2,392.4C100.5,352.6 100.8,312.7 105.6,272.9C110.3,233 113.5,193.2 153.3,153.3Z"/>
    <path id="play" d="M296,292 C296,214 366,174 434,215 L732,395 C796,434 796,518 732,557 L434,737 C366,778 296,738 296,660 Z"/>

    <filter id="shadow" x="-15%" y="-12%" width="130%" height="130%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="play-shadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-12" dy="24" stdDeviation="26" flood-color="#010308" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="wave-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#021c24" flood-opacity="0.55"/>
    </filter>
    <clipPath id="play-clip">
      <use href="#play"/>
    </clipPath>

    <radialGradient id="tile-light" gradientUnits="userSpaceOnUse" cx="512" cy="100" r="600" gradientTransform="translate(512 100) scale(1.45 1) translate(-512 -100)">
      <stop offset="0" stop-color="#6b6b72"/>
      <stop offset="0.3" stop-color="#3c3c42" stop-opacity="0.9"/>
      <stop offset="0.65" stop-color="#16161a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile-rim" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="glass" x1="0.25" y1="0.12" x2="0.72" y2="0.88">
      <stop offset="0" stop-color="#354259"/>
      <stop offset="0.28" stop-color="#182234"/>
      <stop offset="0.68" stop-color="#0c1826"/>
      <stop offset="1" stop-color="#062c36"/>
    </linearGradient>
    <radialGradient id="glass-light" cx="0.25" cy="0.18" r="0.45">
      <stop offset="0" stop-color="#64748b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass-sheen" x1="0.1" y1="0" x2="0.8" y2="0.7">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.3"/>
      <stop offset="0.35" stop-color="#22c3e0" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#0e7490" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glass-depth" cx="0.35" cy="0.82" r="0.55">
      <stop offset="0" stop-color="#14a1b8" stop-opacity="0.48"/>
      <stop offset="0.55" stop-color="#0d5f6e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#091522" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass-rim" x1="0.22" y1="0.15" x2="0.75" y2="0.88">
      <stop offset="0" stop-color="#e6fbff" stop-opacity="0.92"/>
      <stop offset="0.45" stop-color="#a6eefa" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#5fd8ec" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glass-bevel" x1="0.3" y1="0.12" x2="0.65" y2="0.9">
      <stop offset="0" stop-color="#d9fbff" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#7ee3f5" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2dbdd4" stop-opacity="0.28"/>
    </linearGradient>

    <linearGradient id="wave-deep" x1="0.2" y1="0.3" x2="0.85" y2="0.85">
      <stop offset="0" stop-color="#074d59"/>
      <stop offset="0.5" stop-color="#0a6575"/>
      <stop offset="1" stop-color="#064652"/>
    </linearGradient>
    <linearGradient id="wave-mid" x1="0.25" y1="0.25" x2="0.85" y2="0.8">
      <stop offset="0" stop-color="#0d788a"/>
      <stop offset="0.5" stop-color="#14a1b8"/>
      <stop offset="1" stop-color="#0d6574"/>
    </linearGradient>
    <linearGradient id="wave-bright" x1="0.2" y1="0.3" x2="0.95" y2="0.65">
      <stop offset="0" stop-color="#1895a9"/>
      <stop offset="0.45" stop-color="#2dbdd4"/>
      <stop offset="0.85" stop-color="#20b2c9"/>
      <stop offset="1" stop-color="#117b8c"/>
    </linearGradient>
    <linearGradient id="wave-crest" x1="0.15" y1="0.2" x2="0.75" y2="0.65">
      <stop offset="0" stop-color="#6fe5f7"/>
      <stop offset="0.4" stop-color="#8cedfc"/>
      <stop offset="0.75" stop-color="#5ed7ea"/>
      <stop offset="1" stop-color="#2dbdd4"/>
    </linearGradient>
    <linearGradient id="wave-foam" x1="0.1" y1="0.35" x2="0.65" y2="0.65">
      <stop offset="0" stop-color="#99eaf6"/>
      <stop offset="0.55" stop-color="#5ed7ea"/>
      <stop offset="1" stop-color="#26aabf"/>
    </linearGradient>
    <linearGradient id="wave-front" x1="0.15" y1="0.65" x2="0.75" y2="0.85">
      <stop offset="0" stop-color="#7eebfc"/>
      <stop offset="0.35" stop-color="#47d1e5"/>
      <stop offset="0.75" stop-color="#1fb0c7"/>
      <stop offset="1" stop-color="#0f6776"/>
    </linearGradient>
  </defs>

  <use href="#tile" fill="#000" filter="url(#shadow)"/>
  <use href="#tile" fill="#000"/>
  <use href="#tile" fill="url(#tile-light)"/>
  <use href="#tile" fill="none" stroke="url(#tile-rim)" stroke-width="4"/>

  <!-- The triangle's paths sit 36 high; this centres its box on the tile. -->
  <g transform="translate(0 36)" filter="url(#play-shadow)">
    <use href="#play" fill="url(#glass)"/>
    <use href="#play" fill="url(#glass-light)"/>
    <use href="#play" fill="url(#glass-sheen)"/>
    <use href="#play" fill="url(#glass-depth)"/>

    <g clip-path="url(#play-clip)">
      <path d="M280,450 Q380,400 450,510 Q540,620 750,520 L750,790 L280,790 Z" fill="#052e36" opacity="0.65"/>
      <path d="M285,480 C315,435 375,380 455,375 C495,372 525,392 505,418 C462,422 430,468 438,518 C448,578 525,615 615,595 C675,582 720,552 775,565 L775,770 L285,770 Z" fill="url(#wave-deep)" filter="url(#wave-shadow)"/>
      <path d="M332,492 C325,425 385,365 468,365 C495,365 512,382 496,405 C452,412 405,455 415,522 C425,585 508,632 618,618 C672,610 725,578 770,582 L770,750 L315,750 Z" fill="url(#wave-mid)" filter="url(#wave-shadow)"/>
      <path d="M368,488 C365,425 418,378 482,382 C442,402 388,452 396,520 C406,595 505,652 632,630 C685,620 735,588 778,582 L778,720 L340,720 Z" fill="#0d788a" opacity="0.85"/>
      <path d="M412,505 C405,442 448,402 498,402 C455,428 432,475 445,525 C462,588 538,618 612,578 C662,550 715,522 778,545 L778,610 C722,578 668,585 615,612 C535,652 428,605 412,505 Z" fill="url(#wave-bright)" filter="url(#wave-shadow)"/>
      <path d="M416,495 C412,448 448,412 488,406 C450,438 438,485 455,532 C478,595 562,625 658,618 C620,645 522,648 455,585 C425,556 418,522 416,495 Z" fill="#5ed7ea" opacity="0.88"/>
      <path d="M285,525 C315,475 365,480 385,535 C395,585 445,638 545,665 L515,745 L285,745 Z" fill="#085361"/>
      <path d="M285,555 C312,508 355,518 368,565 C382,615 442,658 535,678 L485,755 L285,755 Z" fill="#0e7587"/>
      <path d="M285,488 C318,452 362,438 392,450 C402,454 405,464 396,467 C388,469 382,464 376,466 C385,472 396,482 394,496 C392,508 380,515 372,508 C376,502 374,492 364,490 C352,488 342,495 344,506 C346,518 334,528 324,522 C329,515 325,504 314,504 C300,504 290,518 285,535 Z" fill="url(#wave-foam)" filter="url(#wave-shadow)"/>
      <path d="M285,432 C338,385 408,332 458,318 C492,308 518,322 518,342 C518,352 508,358 502,350 C498,345 488,344 482,350 C476,356 478,364 492,365 C515,360 545,358 562,374 C574,386 572,402 560,404 C554,405 552,396 544,396 C536,396 534,404 542,412 C565,408 595,418 608,438 C620,456 614,482 598,484 C590,485 588,476 592,470 C595,464 588,454 574,454 C560,454 554,462 558,474 C564,494 552,516 530,518 C512,520 496,508 500,496 C502,490 510,492 515,496 C524,500 532,490 528,476 C522,456 502,442 478,440 C482,428 478,412 462,408 C442,404 422,415 416,428 C412,415 398,408 382,414 C360,422 346,445 344,468 C322,472 302,486 285,508 Z" fill="url(#wave-crest)" filter="url(#wave-shadow)"/>
      <path d="M285,432 C338,385 408,332 458,318 C492,308 518,322 518,342 C518,352 508,358 502,350 C498,345 488,344 482,350 C476,356 478,364 492,365 C508,362 528,362 544,368 C512,374 475,368 442,385 C425,394 416,410 416,428 C416,436 408,442 400,440 C394,438 396,430 390,426 C382,422 368,426 358,438 C348,450 344,462 344,468 C322,472 302,486 285,508 Z" fill="#9eeffc" opacity="0.75"/>
      <path d="M285,638 C328,605 392,598 448,622 C502,645 545,672 608,672 L562,705 C505,698 462,672 422,648 C408,642 398,648 408,660 C418,672 412,680 398,672 C382,662 365,658 358,668 C350,680 375,708 428,728 C452,738 478,742 502,742 L465,768 C412,762 368,735 335,712 C315,698 298,698 285,712 Z" fill="url(#wave-front)" filter="url(#wave-shadow)"/>
      <path d="M285,712 C298,698 315,698 335,712 C368,735 412,762 465,768 L285,785 Z" fill="#074a56" opacity="0.85"/>
      <path d="M342,360 C348,342 366,336 376,346 C382,352 378,362 370,362 C360,358 350,360 342,366 Z" fill="#8cedfc"/>
      <path d="M392,322 C398,308 412,306 418,314 C422,320 416,328 408,326 C400,324 396,326 392,328 Z" fill="#8cedfc"/>
      <circle cx="328" cy="378" r="6" fill="#8cedfc"/>
      <circle cx="585" cy="512" r="5.5" fill="#7eebfc"/>
      <circle cx="618" cy="494" r="6.5" fill="#7eebfc"/>
      <use href="#play" fill="none" stroke="url(#glass-bevel)" stroke-width="10"/>
    </g>
    <use href="#play" fill="none" stroke="url(#glass-rim)" stroke-width="6"/>
  </g>
</svg>
